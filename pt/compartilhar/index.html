  <style>
    :root {
      --navy: #071d3a;
      --text: #31516f;
      --muted: #496984;
      --bg-top: #dcecf7;
      --bg-bottom: #f5f8fb;
      --white: #ffffff;
      --header: #f7f9fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: linear-gradient(
        180deg,
        var(--bg-top) 0%,
        #eaf3f9 55%,
        var(--bg-bottom) 100%
      );
      line-height: 1.65;
    }

    header {
      height: 69px;
      display: flex;
      align-items: center;
      padding: 0 60px;
      background: var(--header);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #17283e;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      font-weight: 500;
      text-decoration: none;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: #101c32;
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px 60px;
      text-align: center;
    }

    .share-card {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 25px;
      padding: 30px;
      box-shadow: 0 13px 30px rgba(31, 66, 97, 0.10);
    }

    .share-card img {
      width: 100%;
      height: auto;
      border-radius: 16px;
      display: block;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 13px;
      color: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    p.description {
      margin: 0 0 26px;
      font-size: 16px;
      color: var(--muted);
    }

    .download-link {
      display: inline-block;
      background: var(--navy);
      color: var(--white);
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 12px;
    }

    .redirect-notice {
      margin: 16px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      header { padding: 0 20px; height: 62px; }
      .brand { font-size: 19px; }
      .brand-icon { width: 36px; height: 36px; border-radius: 11px; }
      main { padding: 28px 16px 48px; }
      .share-card { border-radius: 20px; padding: 22px; }
      h1 { font-size: 24px; }
      p.description { font-size: 14px; }
    }
  </style>
</head>

<body>
  <header>
    <a href="/" class="brand" aria-label="Ir para a página inicial">
      <div class="brand-icon">📞</div>
      <span>Só Quem Conheço</span>
    </a>
  </header>

  <main>
    <article class="share-card">
      <img src="/social_1200_600.png" alt="Só Quem Conheço : Bloqueio Telemarketing" width="1200" height="600">  
      <h1>Só Quem Conheço</h1>
      <h1>Bloqueio de Telemarketing</h1>
      <p class="description">
        Você cansou de ligações incovenienntes? Só Quem Conheço bloqueia todas as liagações de quem não estiver nos seus contatos.
      </p>
      <a class="download-link" href="https://play.google.com/store/apps/details?id=com.infodados.blockcalls" target="_blank" rel="noopener noreferrer">
        Baixar na Play Store
      </a>
      <p class="redirect-notice">
        Você será redirecionado para a Play Store em <span id="redirect-countdown">5</span> segundos...
      </p>
    </article>
  </main>

  <script>
    (function () {
      var PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.infodados.blockcalls';
      var seconds = 6;
      var countdownEl = document.getElementById('redirect-countdown');

      var timer = setInterval(function () {
        seconds -= 1;
        if (countdownEl) {
          countdownEl.textContent = String(Math.max(seconds, 0));
        }
        if (seconds <= 0) {
          clearInterval(timer);
          window.location.href = PLAY_STORE_URL;
        }
      }, 1000);
    })();
  </script>
</body>
